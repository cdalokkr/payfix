steps:\n  - name: gcr.io/cloud-builders/docker\n    args:\n      - build\n      - -t\n      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$SHORT_SHA\n      - python-service\n\n  - name: gcr.io/cloud-builders/docker\n    args:\n      - push\n      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$SHORT_SHA\n\n  - name: gcr.io/google.com/cloudsdktool/cloud-sdk\n    entrypoint: gcloud\n    args:\n      - run\n      - deploy\n      - ${_SERVICE}\n      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$SHORT_SHA\n      - --region=${_REGION}\n      - --platform=managed\n      - --service-account=${_RUNTIME_SERVICE_ACCOUNT}\n      - --allow-unauthenticated\n      - --memory=2Gi\n      - --cpu=1\n      - --concurrency=1\n      - --min-instances=0\n      - --max-instances=1\n      - --timeout=60\n      - --set-secrets=FACE_API_TOKEN=payfix-face-api-token:latest\n\nsubstitutions:\n  _REGION: asia-south1\n  _REPOSITORY: payfix-containers\n  _SERVICE: payfix-face-service\n  _RUNTIME_SERVICE_ACCOUNT: payfix-face-runtime@payfix-develop.iam.gserviceaccount.com\n\nimages:\n  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$SHORT_SHA\n\ntimeout: 1800s\noptions:\n  logging: CLOUD_LOGGING_ONLY\n