name: SaaS CI

on:
  push:
    branches:
      - develop
      - hardening/develop-camera-performance
      
  pull_request:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: saas-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate SaaS migration scope
        run: pnpm run validate:saas-migrations

      - name: Test SaaS migration policy
        run: pnpm run test:saas-migrations

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test --runInBand

      - name: Build with Turbopack
        run: pnpm run build:turbopack

      - name: Build with webpack
        run: pnpm run build:webpack
